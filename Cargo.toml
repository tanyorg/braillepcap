[package]
name = "braillepcap"
version = "0.2.0"
edition = "2021"
description = "IPv4 Traffic Visualization using Unicode Braille sub-pixels for terminal graphics"
authors = ["Fuminori -Tany- Tanizaki"]
readme = "README.md"
keywords = ["pcap", "tui", "network", "terminal-graphics", "visualization"]
categories = ["network-programming", "command-line-utilities"]
license = "MIT"

[[bin]]
name = "braillepcap"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
ratatui = "0.26"
crossterm = "0.27"
pcap = "2.0"
chrono = "0.4"
